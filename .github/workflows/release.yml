name: Build e Release Multiplataforma

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Release Linux
        run: cargo build --release

      - name: Empacotar Binário Linux
        run: |
          mkdir -p dist
          cp target/release/sankhya-impressao-rapida dist/
          cp -r certs dist/
          tar -czvf sankhya-impressao-rapida-linux-x86_64.tar.gz -C dist .

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: sankhya-impressao-rapida-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x64 e Instalador
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Release Windows
        run: cargo build --release

      - name: Compactar Binário Windows (ZIP)
        run: |
          powershell Compress-Archive -Path target\release\sankhya-impressao-rapida.exe -DestinationPath sankhya-impressao-rapida-windows-x64.zip

      - name: Compilar Instalador Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-windows
          path: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: .

      - name: Baixar Artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: artefatos-windows
          path: .

      - name: Criar ou Atualizar Release v1.0.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "Sankhya Impressão Rápida v1.0.8"
          body: |
            ### 🚀 Novidades da Versão 1.0.8:
            - **Diálogo Nativo "Save Print Output As":** Ao selecionar "Microsoft Print to PDF", o sistema abre a janela nativa do Windows para o usuário escolher exatamente em qual pasta e com qual nome deseja salvar o PDF gerado.
            - **Atualização Transparente e Segura:** O instalador detecta versões anteriores já instaladas, finaliza processos com segurança e atualiza sem loops de UAC e sem travar arquivos.
            - **Exibição Clara da Versão no Windows:** O Painel de Controle e Configurações do Windows exibem claramente a versão instalada ("Sankhya Impressão Rápida v1.0.8").
            - **Verificador de Atualizações Integrado:** Checagem periódica contra as releases oficiais do GitHub, alertando sobre novidades via log e endpoint `/.checkUpdate`.
            - **Conversão Ultra-Rápida JasperPrint XML -> PDF:** Processamento em menos de 1 segundo consumindo menos de 8 MB de RAM.
            - **Suporte Multiplataforma Completo:** Compatível com Windows e Linux (com diálogo Zenity nativo).
          files: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip
            sankhya-impressao-rapida-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
