name: Build e Release Multiplataforma

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Release Linux
        run: cargo build --release

      - name: Empacotar Binário Linux
        run: |
          mkdir -p dist
          cp target/release/sankhya-impressao-rapida dist/
          cp -r certs dist/
          tar -czvf sankhya-impressao-rapida-linux-x86_64.tar.gz -C dist .

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: sankhya-impressao-rapida-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x64 e Instalador
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Release Windows
        run: cargo build --release

      - name: Compactar Binário Windows (ZIP)
        run: |
          powershell Compress-Archive -Path target\release\sankhya-impressao-rapida.exe -DestinationPath sankhya-impressao-rapida-windows-x64.zip

      - name: Compilar Instalador Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-windows
          path: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: .

      - name: Baixar Artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: artefatos-windows
          path: .

      - name: Criar ou Atualizar Release v1.0.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "Sankhya Impressão Rápida v1.0.9"
          body: |
            ### 🚀 Novidades da Versão 1.0.9:
            - **Navegador 100% Fluido (Zero Travamentos):** O endpoint `/.localPrinting` responde imediatamente ao Sankhya em < 1 ms, liberando a thread JavaScript do Chrome/Edge instantaneamente e eliminando qualquer risco de tela "Page Unresponsive".
            - **Diálogo Nativo "Save Print Output As" em Primeiro Plano:** Ao imprimir com "Microsoft Print to PDF", o diálogo padrão do Windows aparece na tela do usuário para seleção de pasta e nome do arquivo PDF.
            - **Execução na Sessão Interativa do Usuário:** Inicialização automática via Registro (`Run`), garantindo acesso total às impressoras locais/rede e interface gráfica.
            - **Limpeza Automática de Versões Legadas:** O instalador remove serviços antigos em segundo plano e instala a versão mais recente de forma totalmente limpa.
          files: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip
            sankhya-impressao-rapida-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
