name: Build e Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Release
        run: cargo build --release

      - name: Compactar Executável
        run: |
          powershell Compress-Archive -Path target\release\sankhya-impressao-rapida.exe -DestinationPath sankhya-impressao-rapida-windows-x64.zip

      - name: Publicar Artefato da Build
        uses: actions/upload-artifact@v4
        with:
          name: sankhya-impressao-rapida-windows-x64
          path: target/release/sankhya-impressao-rapida.exe

      - name: Criar ou Atualizar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Sankhya Impressão Rápida v1.0.0"
          body: "Substituto nativo e ultra-leve em Rust para o Sankhya Web Connection."
          files: |
            target/release/sankhya-impressao-rapida.exe
            sankhya-impressao-rapida-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
