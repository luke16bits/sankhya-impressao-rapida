name: Build e Release Multiplataforma

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Release Linux
        run: cargo build --release

      - name: Empacotar Binário Linux
        run: |
          mkdir -p dist
          cp target/release/sankhya-impressao-rapida dist/
          cp -r certs dist/
          tar -czvf sankhya-impressao-rapida-linux-x86_64.tar.gz -C dist .

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: sankhya-impressao-rapida-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x64 e Instalador
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Release Windows
        run: cargo build --release

      - name: Compactar Binário Windows (ZIP)
        run: |
          powershell Compress-Archive -Path target\release\sankhya-impressao-rapida.exe -DestinationPath sankhya-impressao-rapida-windows-x64.zip

      - name: Compilar Instalador Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-windows
          path: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: .

      - name: Baixar Artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: artefatos-windows
          path: .

      - name: Criar ou Atualizar Release v1.0.7
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "Sankhya Impressão Rápida v1.0.7"
          body: |
            ### 🚀 Novidades e Correções da Versão 1.0.7:
            - **Correção Crítica no Protocolo Java Serialization:** Ajustado descritor de classe `[Ljava.lang.String;` corrigindo definitivamente o erro interno de servlet no WildFly.
            - **Conversor JasperPrint XML -> PDF Embutido:** Conversão automática e instantânea de relatórios Jasper XML para PDFs de alta resolução via micro-processo (`JasperToPdf.class`).
            - **Suporte Perfeito a Microsoft Print to PDF e PDF Físico:** Salva o PDF real na pasta Downloads e abre automaticamente na tela ou despacha para a impressora física via spooler nativo do Windows / Linux CUPS.
            - **Preflight Private Network Access (PNA):** Headers `Access-Control-Allow-Private-Network: true` garantindo permissão em navegadores Chrome e Edge modernos contra restrições de loopback.
            - **Instalador Resiliente:** Encerramento limpo e seguro de instâncias anteriores antes da substituição de arquivos, prevenindo arquivos travados e loops de janela.
            - **100% Universal e Aberto:** Código limpo e independente de ambientes específicos.
          files: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip
            sankhya-impressao-rapida-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
