name: Build e Release Multiplataforma

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar Release Linux
        run: cargo build --release

      - name: Empacotar Binário Linux
        run: |
          mkdir -p dist
          cp target/release/sankhya-impressao-rapida dist/
          cp -r certs dist/
          tar -czvf sankhya-impressao-rapida-linux-x86_64.tar.gz -C dist .

      - name: Upload Artefato Linux
        uses: actions/upload-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: sankhya-impressao-rapida-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows x64 e Instalador
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compilar Release Windows
        run: cargo build --release

      - name: Compactar Binário Windows (ZIP)
        run: |
          powershell Compress-Archive -Path target\release\sankhya-impressao-rapida.exe -DestinationPath sankhya-impressao-rapida-windows-x64.zip

      - name: Compilar Instalador Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-windows
          path: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip

  publish-release:
    name: Publicar Release no GitHub
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefatos Linux
        uses: actions/download-artifact@v4
        with:
          name: sankhya-impressao-rapida-linux-x86_64
          path: .

      - name: Baixar Artefatos Windows
        uses: actions/download-artifact@v4
        with:
          name: artefatos-windows
          path: .

      - name: Criar ou Atualizar Release v1.0.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "Sankhya Impressão Rápida v1.0.6"
          body: |
            ### 🚀 Novidades e Correções da Versão 1.0.6:
            - **Comunicação Nativa com Servlet Java:** Implementação do protocolo binário Java Serialized (`[Ljava.lang.String;`) via POST para o `impressaoNotaServlet.mge`, garantindo download 100% confiável dos jobs de impressão da Central de Notas / DANFE.
            - **Descompactação Dupla (ZIP + GZIP):** Descompacta tanto o container de transporte do Sankhya (`ImpressaoNotaServletResponse`) quanto o fluxo interno de documentos GZIP.
            - **Suporte Inteligente a PDF:** Documentos e relatórios em PDF são salvos diretamente em disco e abertos instantaneamente na tela quando selecionado "Microsoft Print to PDF" ou impresso sem fila física.
            - **Detecção Confiável do Web Connection:** Middleware transparente com suporte total a URLs com parâmetros de matriz (`;sessionId=...`).
            - **Instalação Silenciosa sem Conflitos:** Atualização sem travamento de processos e sem loops de UAC.
            - **Código 100% Universal e Aberto:** Sem nenhum dado ou domínio corporativo embutido. Pronto para qualquer empresa usuária do Sankhya.
            - **Compatibilidade Multiplataforma Completa:** Binários nativos para Windows (x64) e Linux (x86_64).
          files: |
            Instalador-Sankhya-Impressao-Rapida.exe
            sankhya-impressao-rapida-windows-x64.zip
            sankhya-impressao-rapida-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
